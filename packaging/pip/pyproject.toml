# tg-proxy pip wrapper. Each wheel is a Python no-op that carries the
# prebuilt tg-proxy binary inside src/tg_proxy/bin/. Same model that ruff,
# esbuild, etc. use.
#
# The `version` field is overwritten by packaging/pip/build_wheels.py at
# release time; the value below is just a placeholder for local builds.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-proxy"
version = "0.0.0"
description = "Lightweight network proxy with built-in PII / secret scanners and pluggable in-flight redaction."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "TensorGreed" }]
keywords = ["proxy", "mitm", "pii", "redaction", "scanner", "security"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Internet :: Proxy Servers",
]

[project.urls]
Homepage    = "https://github.com/TensorGreed/tg-proxy"
Repository  = "https://github.com/TensorGreed/tg-proxy"
Issues      = "https://github.com/TensorGreed/tg-proxy/issues"

[project.scripts]
tg-proxy = "tg_proxy.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages    = ["tg_proxy"]
include-package-data = true

[tool.setuptools.package-data]
tg_proxy = ["bin/*"]
